[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-media-downloader"
version = "1.4.4"
description = "Native Windows image downloader for accessible X profiles, with an experimental Pixiv adapter"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-2.0-or-later"
dependencies = [
  "PySide6-Essentials==6.11.2",
  "PySide6-Addons==6.11.2",
  "gallery-dl==1.32.16",
  "requests==2.34.2",
  "Pillow==12.3.0",
  "pycryptodomex==3.24.1",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.8"]
test = ["pytest==9.1.1"]

[project.scripts]
mira-media-downloader = "mira_media.__main__:main"

[tool.setuptools.packages.find]
include = ["mira_media*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
